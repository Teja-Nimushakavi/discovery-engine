services:
  # The FastAPI REST API
  - type: web
    name: discovery-engine-api
    env: docker
    dockerfilePath: api/Dockerfile
    plan: free # or 'starter' depending on your needs
    envVars:
      - key: DATABASE_URL
        sync: false # Set this in the Render Dashboard (from Supabase/Neon)
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false

