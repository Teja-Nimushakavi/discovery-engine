version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: discovery_engine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./storage/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/discovery_engine
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

  # The pipeline is a job, so we don't start it by default, or it runs and exits.
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/discovery_engine
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - pipeline # Must be explicitly run using `docker-compose --profile pipeline up`

volumes:
  postgres_data:

